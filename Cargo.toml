[package]
name = "simplebookmarker"
version = "0.1.0"
edition = "2024"
description = "Add PDF bookmarks from a simple indented text file"
license = "MIT"
readme = "README.md"
repository = "https://github.com/qchen-fdii-cardc/simplebookmarker"
homepage = "https://github.com/qchen-fdii-cardc/simplebookmarker"
keywords = ["pdf", "bookmark", "outline", "cli"]
categories = ["command-line-utilities"]
exclude = ["target/", "*.pdf", "bookmarks.txt"]

[[bin]]
name = "sbm"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
lopdf = "0.44.0"
